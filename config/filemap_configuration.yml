paths:
  log_dir: logs/
  log_file: __session__.log
  config_dir: config/
  database_dir: db_Files/
  user_databases: user_databases.yml
default_databases:
- name: Test Database
  db_path: null
  db_file: linux_db_test.db
  requires_password: false
  key_path: null
  key_file: null
  autoload: true
ui:
  window_maximized: true
  window_geometry: 1200x800+50+50
  theme: dark
behavior:
  log_per_session: false
  autosave_interval: 300
  check_updates: false
export:
  csv_delimiter: ','
  batch_size: 100
  print_database_header: true
  print_map_header: true
  default_selection: file_tree
  default_format: filestruct_json
  default_selected_fields: null
